name: Build iOS (Xcode)

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Phiên bản Xcode trên máy build (vd. 27.2)"
        default: "27.2"
      export_method:
        description: "Kiểu xuất IPA khi có chứng chỉ (release-testing = Ad Hoc, debugging = Development, app-store-connect = TestFlight)"
        default: "release-testing"
  push:
    branches: [main]
    paths: ["docs/**", "ios/**", "capacitor.config.json", "package.json", "package-lock.json", ".github/workflows/build-ios.yml"]

jobs:
  ios:
    runs-on: macos-latest
    env:
      XCODE_VERSION: ${{ inputs.xcode || '27.2' }}
      EXPORT_METHOD: ${{ inputs.export_method || 'release-testing' }}
      PROJECT: ios/App/App.xcodeproj
      # Tuỳ chọn: chứng chỉ Apple để xuất IPA đã ký (xem README, mục iOS)
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Chọn Xcode ${{ env.XCODE_VERSION }}
        run: |
          APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Máy build không có Xcode ${XCODE_VERSION}. Các bản có sẵn:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios

      - name: Build cho iOS Simulator
        run: |
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          (cd build/sim/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/HNews-simulator.zip" App.app)

      - name: Build cho iPhone (IPA chưa ký, dùng với Sideloadly/AltStore)
        run: |
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/HNews-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p build/ipa/Payload
          cp -R build/HNews-unsigned.xcarchive/Products/Applications/App.app build/ipa/Payload/
          (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/HNews-unsigned.ipa" Payload)

      - name: Build IPA đã ký (khi có chứng chỉ trong Secrets)
        if: env.IOS_P12_BASE64 != '' && env.IOS_PROFILE_BASE64 != '' && env.IOS_TEAM_ID != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"; KC_PASS="$(uuidgen)"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/HNews.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>io.github.hientrannt.hnews</key><string>${PROFILE_UUID}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/HNews.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/signed
          cp build/signed/*.ipa "$GITHUB_WORKSPACE/HNews.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: HNews-iOS
          path: |
            HNews-simulator.zip
            HNews-unsigned.ipa
            HNews.ipa
          if-no-files-found: warn
