<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<clipPath id="r"><rect width="1024" height="1024" rx="224"/></clipPath>
<g clip-path="url(#r)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0453A"/><stop offset=".55" stop-color="#B3261E"/><stop offset="1" stop-color="#7A1410"/>
    </linearGradient>
    <radialGradient id="gl" cx=".3" cy=".2" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
